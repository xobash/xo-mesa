<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mesa acceptance fixture</title></head><body><div id="root"></div>
<script type="module">
// Development-only, synthetic browser acceptance surface. No personal vault I/O.
import { createElement } from 'react';
import { createRoot } from 'react-dom/client';
import App from '/src/App.tsx';
import { useAppStore } from '/src/store.ts';
import { createNote, DEMO_ROOT } from '/src/lib/vault.ts';
import '/src/styles.css';
if (!import.meta.env.DEV) throw new Error('Acceptance fixture is development-only');
localStorage.setItem('mesa:toured', '1');
await createNote(DEMO_ROOT, 'Acceptance.md', 'Original text\n');
await createNote(DEMO_ROOT, 'Acceptance (conflict from test-device 2026-09-08).md', 'Other device text\n');
await useAppStore.getState().openVault(DEMO_ROOT);
useAppStore.setState(s => ({ files: s.files.map(file => ({ ...file, size: file.relPath.startsWith('Acceptance') ? 100 : file.size })), tourOpen: false, syncOpen: true }));
createRoot(document.getElementById('root')).render(createElement(App));
</script></body></html>

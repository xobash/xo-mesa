[package]
name = "mesa"
version = "0.1.0"
description = "Mesa — an open-source note vault with a living graph view"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mesa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multiwebview (Window::add_child): the Pi browser harness
# hosts real pages in a native child webview (src/harness.rs) instead of an
# embed-blocked iframe. The flag gates that API's availability only.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
# Mesa's native vault watcher (src/vaultwatch.rs) drives this debouncer directly
# so it can filter `.git`/dot churn and coalesce a whole debounce window into ONE
# IPC message — the plugin's `watch` sends one message per raw event, which is
# one WebView2 UI-thread eval each on Windows. Already in the tree as a
# transitive dep of tauri-plugin-fs (same 0.6.0 in Cargo.lock), so this adds no
# new supply-chain surface; it only makes the dependency direct.
notify-debouncer-full = "0.6"
tauri-plugin-dialog = "2"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

# P2P device sync is end-to-end encrypted over TLS (LocalSend-style):
# - rcgen mints a persistent self-signed cert/key per device (the identity).
# - Hyper + Tokio-Rustls serve the sync API over HTTPS using that cert.
# - reqwest + rustls is the client, with a custom certificate verifier that
#   pins the peer's SHA-256 cert fingerprint (trust-on-first-use, then enforced).
# tiny_http remains only for plain loopback helper/test servers; it must not
# regain the ssl-rustls feature.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The sync engine (sync_run) runs transfers with bounded concurrency on the
# Tauri tokio runtime; tokio itself was already in the tree via tauri/reqwest —
# this only turns on the sync/time/rt feature flags used directly.
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
sha2 = "0.10"
pem = "3"
bytes = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# Native exclusive-rename flags used by the sync create-only commit path.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# MoveFileExW without MOVEFILE_REPLACE_EXISTING is the Windows no-replace
# publish primitive and works on removable FAT/exFAT volumes.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package]
name = "mesa"
version = "0.1.0"
description = "A local desktop workspace for research, documents, tools, and action."
edition = "2021"
rust-version = "1.89"

[lib]
name = "mesa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multiwebview (Window::add_child): the Pi browser harness
# hosts real pages in a native child webview (src/harness.rs) instead of an
# embed-blocked iframe. The flag gates that API's availability only.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
# Native watcher imports this debouncer for filtered, batched delivery.
notify-debouncer-full = "0.6"
tauri-plugin-dialog = "2"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

# Sync uses rcgen identity certificates, Hyper/Tokio-Rustls server TLS, and reqwest certificate pinning.
# tiny_http is loopback-only here; do not enable ssl-rustls.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The sync engine (sync_run) runs transfers with bounded concurrency on the
# Tauri tokio runtime; tokio itself was already in the tree via tauri/reqwest —
# this enables the features used directly by the listener and sync engine.
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
encoding_rs = "0.8"
url = "2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = "0.26"
spake2 = "=0.4.0"
sha2 = "0.10"
keyring = "4.2.0"
pem = "3"
bytes = "1"
ring = "0.17"
socket2 = "0.6"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2.5"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# Native exclusive-rename flags used by the sync create-only commit path.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# MoveFileExW without MOVEFILE_REPLACE_EXISTING is the Windows no-replace
# publish primitive and works on removable FAT/exFAT volumes.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

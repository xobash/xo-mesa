name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast gate: type-check, unit tests, and the web build on Linux.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:bootstrap
      - run: npm run test:index
      - run: npm run build
      - run: npm run audit:public
      # Registry-backed advisory gate. Kept separate from the offline
      # `supplyChainContract.test.ts` pins, which catch a bad lockfile but
      # cannot see an advisory published after the pin was written.
      - run: npm audit --audit-level=moderate

  # Rust unit tests + lints. Roughly half the tests (terminal history, UTF-8
  # read boundaries, harness snapshot parsing) have no TypeScript mirror, so
  # without this job they only ever run on a developer's machine.
  #
  # Windows and macOS are in the matrix, not just Linux: the PTY resolver's
  # PATHEXT lookup, the Node-shebang launch path and the cmd.exe wrapper
  # fallback are all behind `#[cfg(target_os = "windows")]`, while macOS owns
  # WKWebView/title-bar behavior and Unix-only filesystem primitives. No
  # bundling here — the desktop job below still owns that.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies (WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Warnings are how the Rust surface stays small and reviewable; a build
      # that only "compiles" is not the bar this project sets.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  # Native desktop bundles. Windows first, Linux last (project priority).
  desktop:
    needs: [frontend, rust, rust-advisory]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Add macOS universal build targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Install Linux system dependencies (WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev
      - run: npm ci
      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.name == 'macos' && '--target universal-apple-darwin' || matrix.name == 'windows' && '--bundles msi,nsis' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: mesa-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/universal-apple-darwin/release/bundle/**/*
          if-no-files-found: ignore

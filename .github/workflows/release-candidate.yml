name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed immutable release tag
        required: true
      commit:
        description: Exact forty-character release commit
        required: true

permissions:
  contents: read
  actions: read

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify exact binary publication review
        run: node scripts/asset-metadata.mjs --review docs/binary-review.json
      - run: node scripts/release-gate.mjs
        env:
          MESA_RELEASE_TAG: ${{ inputs.tag }}
          MESA_RELEASE_SHA: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
  macos:
    needs: gate
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.96.0
      - run: npm ci
      - name: Verify release inputs
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for variable in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_BASE64; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing protected release input: $variable" >&2
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/mesa-release.keychain-db"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/mesa-release.p12"
          security import "$RUNNER_TEMP/mesa-release.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/mesa-notary-key.p8"
          chmod 600 "$RUNNER_TEMP/mesa-notary-key.p8"
      - name: Build and verify signed notarized universal app
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/mesa-notary-key.p8
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bash scripts/release-macos.sh
      - run: node scripts/release-products.mjs macos
        env:
          MESA_RELEASE_TAG: ${{ inputs.tag }}
          MESA_RELEASE_SHA: ${{ inputs.commit }}
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: output/release-macos/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos
          path: output/release-macos/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mesa-release.p12" "$RUNNER_TEMP/mesa-notary-key.p8"
          security delete-keychain "$RUNNER_TEMP/mesa-release.keychain-db" || true
  windows:
    needs: gate
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.96.0
      - run: npm ci
      - run: ./scripts/release-windows.ps1
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
      - run: node scripts/release-products.mjs windows
        env:
          MESA_RELEASE_TAG: ${{ inputs.tag }}
          MESA_RELEASE_SHA: ${{ inputs.commit }}
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: output/release-windows/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows
          path: output/release-windows/*
          if-no-files-found: error
          retention-days: 30
  linux:
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.96.0
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run mesa:build -- --bundles appimage,deb
      - run: node scripts/release-products.mjs linux
        env:
          MESA_RELEASE_TAG: ${{ inputs.tag }}
          MESA_RELEASE_SHA: ${{ inputs.commit }}
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: output/release-linux/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux
          path: output/release-linux/*
          if-no-files-found: error
          retention-days: 30

name: macOS release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify release inputs
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for variable in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_BASE64; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing protected release input: $variable" >&2
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/mesa-release.keychain-db"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/mesa-release.p12"
          security import "$RUNNER_TEMP/mesa-release.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/mesa-notary-key.p8"
          chmod 600 "$RUNNER_TEMP/mesa-notary-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/mesa-notary-key.p8" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
      - name: Build and verify signed notarized universal app
        run: bash scripts/release-macos.sh
      - name: Record artifact checksums
        run: |
          set -euo pipefail
          cd src-tauri/target/universal-apple-darwin/release/bundle
          find . -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) -exec shasum -a 256 {} + | sort > release-checksums.txt
          test -s release-checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: mesa-macos-${{ github.sha }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/release-checksums.txt
          if-no-files-found: error

name: parser-fuzz

on:
  push:
    branches: [main, 'verification/**']
  pull_request:
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly-2026-10-06
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri/fuzz
      - run: cargo install cargo-fuzz --version 0.13.1 --locked
      - name: Exercise production sync parsers
        working-directory: src-tauri/fuzz
        run: |
          mkdir -p target/corpus/sync_input target/artifacts/sync_input
          cp seeds/sync_input/* target/corpus/sync_input/
          cargo fuzz run sync_input target/corpus/sync_input -- -max_total_time=120 -max_len=65536 -artifact_prefix=target/artifacts/sync_input/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: parser-crash-inputs
          path: src-tauri/fuzz/target/artifacts/sync_input/
          if-no-files-found: ignore
          retention-days: 7
